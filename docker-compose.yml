# Execution ponctuelle d'un script, modeles et donnees montes en volume.
#   docker compose run --rm train
#   docker compose run --rm train python scripts/eval_generalization.py --model models/a2c/a2c_v2env_s2.zip --algo a2c

services:
  train:
    build:
      context: .
    image: f1-pitstop-rl-v2:latest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
